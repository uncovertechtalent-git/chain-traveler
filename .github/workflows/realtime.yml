name: Realtime

# Live delays for the app. The gtfs.de GTFS-Realtime stream (beta, CC BY-SA 4.0) is 13 MB, changes every 10 seconds and
# has no CORS header, so a browser cannot read it. Every five minutes (the shortest schedule GitHub allows; runs can start
# late, and GitHub switches scheduled workflows off after 60 days without repository activity) this cuts it down to
# data/delays.json, about 70 KB, which the app fetches from its own origin. Two jobs, so that the one that handles the
# third-party data never holds a cloud credential:
#
#   cut      fetch the stream and the published build's manifest and trip ids (public files, from the CDN), run
#            build/realtime.py. No AWS access, no id-token. A stream that is stale, unreadable or from another version of
#            the static feed gives "nothing to publish": the run ends green, writes nothing, and says why in the summary.
#   publish  verify the artifact, then write data/delays.json, and nothing else. Keyless: a 15-minute session of a role
#            that trusts this repository's main branch and may write data/* of one bucket.
#
# Nothing runs until the repository variable S3_DEPLOY is "on": there is no site to take the manifest from before that.
# The runner image's python3 is enough (3.9 or later, standard library only).
# Dry run on your machine: scripts/fetch-delays.sh https://<site> and look at app/data/delays.json.
# The CDN needs no rule for /data/delays.json: it follows the object's "public, max-age=30".
# Secrets (repository): AWS_DATA_ROLE_ARN, SITE_BUCKET.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  cut:
    name: Fetch the stream and cut it down
    if: vars.S3_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.cut.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the stream and the trip ids of the published build, write delays.json
        id: cut
        env:
          SITE_URL: https://chaintraveler.app
        run: |
          rc=0
          scripts/fetch-delays.sh "$SITE_URL" "$RUNNER_TEMP/rt" dist-delays > "$RUNNER_TEMP/cut.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/cut.log"
          case "$rc" in
            0) title="cut" ready=true ;;
            3) title="nothing to publish" ready=false ;;
            *) title="failed (status $rc)" ready=false ;;
          esac
          {
            echo "### Realtime: $title"
            echo
            echo '```'
            cat "$RUNNER_TEMP/cut.log"
            echo '```'
            echo
            echo "Data: gtfs.de realtime stream, CC BY-SA 4.0."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi

      - name: Upload the file
        if: steps.cut.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delays
          path: dist-delays
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to S3
    needs: cut
    if: needs.cut.outputs.ready == 'true' && github.ref == 'refs/heads/main' && vars.S3_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the OIDC token the data role trusts (main branch claim)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delays
          path: dist-delays

      - name: Verify and write data/delays.json
        shell: bash  # adds -o pipefail: a failed token request stops here
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_DATA_ROLE_ARN }}
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
          AWS_REGION: eu-central-1
        run: |
          . scripts/ci/aws-session.sh
          aws_session "$AWS_ROLE_ARN" chain-traveler-data 900
          scripts/ci/publish-delays.sh publish dist-delays "$SITE_BUCKET"
